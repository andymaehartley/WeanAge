<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="WeanAge">
  <!-- Five dentine slices whose heights fall like a weaning curve (high while suckling, then the adult level). -->
  <g fill="#0b5a70">
    <rect x="2" y="5" width="4" height="23" rx="1"/>
    <rect x="8" y="6" width="4" height="22" rx="1"/>
    <rect x="14" y="13" width="4" height="15" rx="1"/>
    <rect x="20" y="20" width="4" height="8" rx="1"/>
    <rect x="26" y="21" width="4" height="7" rx="1"/>
  </g>
</svg>
