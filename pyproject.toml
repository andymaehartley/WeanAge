[project]
name = "weanage"
version = "0.2.0"
description = "Open-source weaning-age estimation from tooth dentine and bone collagen δ15N, for zooarchaeology and bioarchaeology."
readme = "README.md"
license = "MIT"
authors = [{ name = "Annabelle Hartley" }]
requires-python = ">=3.11,<3.15"
keywords = ["zooarchaeology", "weaning", "stable isotopes", "dentine", "livestock"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.12",
    "pydantic>=2.5",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
]

[project.urls]
Homepage = "https://andymaehartley.github.io/WeanAge/"
Repository = "https://github.com/andymaehartley/WeanAge"
Documentation = "https://github.com/andymaehartley/WeanAge/tree/main/docs"
Issues = "https://github.com/andymaehartley/WeanAge/issues"
Changelog = "https://github.com/andymaehartley/WeanAge/blob/main/CHANGELOG.md"

[project.scripts]
weanage = "weanage.cli:main"

[tool.poetry]
packages = [{ include = "weanage", from = "src" }]
include = [
    { path = "src/weanage/data/**/*", format = ["sdist", "wheel"] },
    { path = "src/weanage/web/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
httpx = ">=0.27"
pyinstaller = ">=6.3"
ruff = ">=0.6"
mypy = ">=1.10"
pandas-stubs = "*"
playwright = ">=1.45"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905", "B008"]  # long message strings; zip(strict=) noise; FastAPI File() defaults

[tool.mypy]
ignore_missing_imports = true
