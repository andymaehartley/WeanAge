# Publishes the browser version of WeanAge to GitHub Pages.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: browser version
on:
  push:
    branches: [main]
  workflow_dispatch:  # also lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e . pytest playwright
      - run: playwright install --with-deps chromium
      # Check the real browser version works (Python running in the page) before publishing it.
      - run: WEANAGE_TEST_PYODIDE=1 pytest -q tests/test_browser.py -k browser_version
      - run: python scripts/build_browser.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist/browser }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
