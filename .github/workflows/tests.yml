name: tests
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e . ruff mypy pandas-stubs
      - run: ruff check src tests scripts
      - run: mypy src
  js:  # the web app's pure functions (individual pages, dental-age hand-offs, methods text inputs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node --test "tests/js/*.test.mjs"
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - run: pip install -e . pytest httpx playwright
      - run: playwright install --with-deps chromium  # for the browser test
      - run: pytest -q
  browser-version:  # Python running inside the page (Pyodide), downloaded from its CDN
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e . pytest playwright
      - run: playwright install --with-deps chromium
      - run: WEANAGE_TEST_PYODIDE=1 pytest -q tests/test_browser.py -k browser_version
